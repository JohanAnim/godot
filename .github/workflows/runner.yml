name: 🔗 GHA
on:
  push:
    branches:
      - preview-4.8
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ true }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run target Desktop builds (Linux, macOS, Windows).

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/linux_builds.yml
    with:
      changed-files: ${{ needs.static-checks.outputs.changed-files }}

  macos-build:
    name: 🍎 macOS
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/macos_builds.yml

  windows-build:
    name: 🏁 Windows
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/windows_builds.yml

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [linux-build, macos-build, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Godot 4.8 Accesibilidad ${{ github.ref_name }}
          body: |
            ## Godot 4.8 Accesibilidad - Editores Multiplataforma

            ### 🌟 Mejoras de Accesibilidad Nativas:
            - **Navegación por Grupos (`ROLE_GROUP`)**: Submenús de la barra de menú y categorías de árboles expuestos como contenedores nativos para lectores de pantalla.
            - **Atajo `Alt + Abajo` en `OptionButton`**: Las listas desplegables expanden con `Alt+Abajo` y anuncian la combinación accesible.
            - **Localización Universal de Tooltips**: Traducción automática de todos los consejos de herramientas del editor (`atr(...)`).
            - **Delimitación Estricta en Pestañas (`TabBar`)**: Limpieza de contaminación de nombres en contenedores.

            ### 📦 Ejecutables Disponibles:
            - **Windows**: `windows-editor` y `windows-template`
            - **macOS**: `macos-editor` (Universal Intel/Apple Silicon) y `macos-template`
            - **Linux**: `linux-editor` (Estándar limpio)
          files: "**/*.zip"
          draft: false
          prerelease: false
